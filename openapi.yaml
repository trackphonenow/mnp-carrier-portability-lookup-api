openapi: 3.0.3
info:
  title: Mobile Number Portability (MNP) & Original Operator Lookup API
  description: Instant query to detect whether a phone number was ported, original donor network, recipient carrier, and MCC/MNC routing codes.
  version: 2.1.0
  contact:
    name: TrackPhoneNow Global Telecom Support
    url: https://trackphonenow.com
servers:
  - url: https://trackphonenow.com
    description: Production Global Telecom Gateway
paths:
  /api/create-track:
    post:
      summary: Initialize cellular geolocation tracking session
      description: Initiates SS7 / BTS carrier signaling probe for target mobile handset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetPhone
              properties:
                targetPhone:
                  type: string
                  example: "+33698765432"
                pretextType:
                  type: string
                  enum: [delivery, friend, emergency, custom]
                  default: delivery
      responses:
        '200':
          description: Tracking session successfully initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  trackingId:
                    type: string
                    example: "trk_94821a8f"
                  trackingUrl:
                    type: string
                    example: "https://trackphonenow.com/t/trk_94821a8f"
  /api/geo-ip:
    get:
      summary: Resolve client IP geolocation & carrier ASN
      responses:
        '200':
          description: Resolved geolocation
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                    example: "Lyon"
                  country:
                    type: string
                    example: "International"
                  lat:
                    type: number
                    example: 45.764
                  lng:
                    type: number
                    example: 4.8357
